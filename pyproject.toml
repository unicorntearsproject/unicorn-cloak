[project]
name = "unicorn-cloak"
dynamic = ["version"]
license = "MIT"
license-files = ["LICENSE"]
description = "Mic-reactive layered-sprite avatar overlay for OBS. Replaces PNGTuber-Plus."
requires-python = ">=3.11"
dependencies = [
    "PySide6",
    "sounddevice",
    "numpy",
    "obsws-python",
]

[project.scripts]
unicorn-cloak = "unicorn_cloak.__main__:run"

[project.optional-dependencies]
dev = ["pytest"]
build = ["pyinstaller"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "unicorn_cloak.__version__"}

[tool.setuptools.package-data]
unicorn_cloak = ["assets/fonts/*.ttf", "assets/icons/*.png"]
